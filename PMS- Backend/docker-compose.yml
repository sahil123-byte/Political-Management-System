# Local Kafka broker for the notification outbox/event pipeline
# (see the `notification` package and NOTIFICATIONS.md).
#
# Run:   docker compose up -d
# Stop:  docker compose down
#
# The Spring Boot app connects to it via spring.kafka.bootstrap-servers
# (defaults to localhost:9092 in application.properties). The app itself
# still starts and its REST APIs still work even if this isn't running -
# only the async email/sms/in-app fan-out needs a live broker.

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: pms-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
